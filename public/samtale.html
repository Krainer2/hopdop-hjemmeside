<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4ADE80">
<title>Ticket-samtale - HOPDOP</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0c;color:#dcdedc;font:15px/1.5 Inter,system-ui,sans-serif}
header{background:#000;border-bottom:1px solid #1c2420;padding:18px 24px;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.5px}header span{color:#4ade80;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.krumme{background:#4ade80;color:#052e16;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:9px 16px;border-radius:8px;margin-bottom:18px}
.kort{background:#141917;border:1px solid #1f2a24;border-radius:12px;padding:18px 22px;margin-bottom:18px}
.kort h1{margin:0 0 10px;font-size:22px;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.maerke{background:#16a34a;color:#fff;font-size:12px;padding:3px 10px;border-radius:99px}
.meta{margin:3px 0;color:#aab3ae}.meta b{color:#fff}.hl{color:#4ade80;font-weight:600}
.samtale{background:#1e2420;border-radius:12px;padding:10px 0}
.msg{display:flex;gap:14px;padding:8px 22px}.msg:hover{background:#232a26}
.av{width:42px;height:42px;border-radius:50%;flex:none;background:#3b82f6 center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-transform:uppercase}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.navn{font-weight:600;color:#fff}.navn.bot{color:#4ade80}.app{background:#4ade80;color:#052e16;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}.tid{color:#7b857f;font-size:12px}
.tekst{white-space:pre-wrap;word-break:break-word}
.embed{margin-top:6px;border-left:4px solid #4ade80;background:#171d19;border-radius:4px;padding:8px 12px;max-width:560px}.embed b{display:block;color:#fff;margin-bottom:2px}
.fil{display:inline-block;margin-top:6px;color:#60a5fa}
.bund{background:#4ade80;color:#052e16;border-radius:10px;padding:14px 22px;margin-top:18px;font-weight:600}.bund small{display:block;font-weight:400;opacity:.8}
.fejl{text-align:center;padding:60px 0;color:#aab3ae}
</style>
</head>
<body>
<header><a href="/">HOPDOP</a> <span>Samtaler</span></header>
<main id="m"><div class="fejl">Henter samtalen ...</div></main>
<script src="samtale.js"></script>
</body>
</html>
