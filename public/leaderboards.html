<style>
.lb-layout{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;align-items:flex-start}
.lb-hoved{flex:999 1 620px;min-width:0}
.lb-side{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:16px}
.lb-titel{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.lb-soeg input{width:220px}
.lb-podie{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:18px}
.lb-pod{background:var(--kort2);border:2px solid var(--kant);border-radius:12px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:inherit}
.lb-pod img{width:56px;height:56px;border-radius:8px;image-rendering:pixelated}
.lb-pod .plads{font-family:Inter,system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;font-size:22px}
.lb-pod.p1{order:2;border-color:var(--k-a16207, #A16207);padding-top:24px}.lb-pod.p1 img{width:72px;height:72px}.lb-pod.p1 .plads{color:var(--t-facc15, #FACC15)}
.lb-pod.p2{order:1}.lb-pod.p2 .plads{color:var(--t-d1d5db, #D1D5DB)}
.lb-pod.p3{order:3}.lb-pod.p3 .plads{color:var(--t-fdba74, #FDBA74)}
.lb-pod b{font-size:15px;word-break:break-all}.lb-pod span.v{color:var(--daempet);font-size:14px}
.lb-liste{list-style:none;margin:0;padding:0}
.lb-liste li a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--k-18251d, #18251D);color:inherit;text-decoration:none;border-radius:8px}
.lb-liste li a:hover{background:var(--b-13211a, #13211A)}
.lb-liste .nr{width:40px;text-align:center;font-weight:700;color:var(--t-86efac, #86EFAC);flex:none}
.lb-liste .navn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lb-liste .v{margin-left:auto;color:var(--t-b5c9bc, #B5C9BC);font-weight:600;white-space:nowrap}
.lb-liste .on{width:8px;height:8px;border-radius:2px;background:var(--groen);flex:none}
.lb-liste li.fremhaev a{background:var(--b-16301f, #16301F);outline:2px solid var(--groen)}
.lb-online{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.lb-online a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
@media (max-width:560px){.lb-podie{grid-template-columns:1fr}.lb-pod{order:0 !important}.lb-soeg input{width:100%}.lb-soeg{width:100%}}
</style>
</head>
<body data-side="leaderboards">
<header id="hd-top"></header>
<main class="bred">
<section class="side-top">
<h1>Leaderboards</h1>
<p id="lb-info">Henter data fra serveren...</p>
</section>
<div class="chips" role="tablist" aria-label="Kategori" id="lb-kat"></div>
<div class="chips" role="tablist" aria-label="Leaderboard" id="lb-tavler" style="margin-top:12px"></div>
<div class="lb-layout">
<section class="kort lb-hoved" aria-live="polite">
<div class="lb-titel"><h2 id="lb-navn">-</h2>
<div class="felt lb-soeg"><label for="lb-soeg">Find en spiller</label><input id="lb-soeg" type="search" placeholder="Navn..." autocomplete="off"></div></div>
<div id="lb-podie" class="lb-podie"></div>
<ol id="lb-liste" class="lb-liste"></ol>
<div class="sider" id="lb-sider"></div>
</section>
<aside class="lb-side">
<div class="kort"><h3>Online nu</h3><p class="daempet" id="lb-online-antal" style="margin:6px 0 12px">-</p><ul id="lb-online" class="lb-online"></ul></div>
<div class="kort"><h3>Mangler du?</h3><p class="daempet" style="margin:8px 0 0;font-size:14px">Tallene kommer direkte fra serveren og bliver opdateret hvert 5. minut. Spillere uden point i en kategori bliver ikke vist.</p></div>
</aside>
</div>
</main>
<footer id="hd-bund"></footer>
