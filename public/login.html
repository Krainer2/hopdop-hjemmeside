<style>
.lg{min-height:calc(100vh - 360px);display:flex;align-items:center;justify-content:center;padding:56px 0}
.lg-kort{width:100%;max-width:520px;padding:34px;border-radius:20px;background:var(--nd-flade);border:1px solid var(--nd-kant);border-top:3px solid var(--nd-groen);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.lg-kort small{font:700 12px Silkscreen,monospace;letter-spacing:.2em;color:var(--nd-groen)}
.lg-kort h1{font-size:40px;margin:8px 0 6px}
.lg-kort > p{margin:0 0 22px;color:var(--nd-daempet)}
.lg-trin{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:10px}
.lg-trin li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);color:var(--nd-tekst)}
.lg-trin b{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:rgba(110,240,143,.15);color:var(--nd-groen);font:700 13px Silkscreen,monospace}
.lg-trin code{font:700 15px Silkscreen,monospace;color:var(--nd-groen);background:rgba(110,240,143,.1);padding:2px 8px;border-radius:6px}
.lg-kode{width:100%;box-sizing:border-box;height:72px;text-align:center;font:800 40px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.4em;padding-left:.4em;border-radius:14px;border:2px solid var(--nd-kant);background:rgba(0,0,0,.25);color:var(--nd-tekst);outline:none;transition:border-color .2s,box-shadow .2s}
.lg-kode:focus{border-color:var(--nd-groen);box-shadow:0 0 0 4px rgba(110,240,143,.15)}
.lg-kode::placeholder{color:rgba(255,255,255,.18)}
.lg-knap{width:100%;margin-top:14px}
.lg-fejl{min-height:22px;margin:12px 0 0;color:#FCA5A5;font-size:14.5px}
.lg-ok{color:var(--nd-groen)}
.lg-ind{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
:root[data-tema="lyst"] .lg-kode{background:#fff}
:root[data-tema="lyst"] .lg-kode::placeholder{color:rgba(0,0,0,.18)}
:root[data-tema="lyst"] .lg-trin li{background:rgba(16,40,26,.04)}
</style>

<body data-side="login">
<header id="hd-top"></header>
<main class="bred">
<section class="lg">
<div class="lg-kort">
<small>HOPDOP · LOGIN</small>
<h1>Log ind</h1>
<p>Du logger ind med din Minecraft-konto. Det tager 10 sekunder.</p>
<div id="lg-form-boks">
<ol class="lg-trin">
<li><b>1</b><span>Join <strong>hopdop.superawesome.dk</strong></span></li>
<li><b>2</b><span>Skriv <code>/weblogin</code> i chatten</span></li>
<li><b>3</b><span>Skriv koden du får herunder</span></li>
</ol>
<form id="lg-form" autocomplete="off">
<label for="lg-kode" class="sr">Kode fra Minecraft</label>
<input id="lg-kode" class="lg-kode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autofocus>
<button class="knap groen lg-knap" type="submit">Log ind</button>
<p id="lg-fejl" class="lg-fejl" role="alert"></p>
</form>
</div>
<div id="lg-ind" class="lg-ind skjult"></div>
</div>
</section>
</main>
<footer id="hd-bund"></footer>
<script src="faelles.js"></script>
<script>
(function () {
  var H = window.HD;
  var til = new URLSearchParams(location.search).get('til') || '/';
  if (!/^\/(?!\/)[A-Za-z0-9._\-\/?=&%#]{0,200}$/.test(til)) til = '/';
  var input = document.getElementById('lg-kode');
  var form = document.getElementById('lg-form');
  var fejl = document.getElementById('lg-fejl');
  var mig = H.login();
  if (mig) {
    document.getElementById('lg-form-boks').classList.add('skjult');
    var ind = document.getElementById('lg-ind');
    ind.classList.remove('skjult');
    ind.innerHTML = '<p class="lg-ok" style="margin:0">Du er logget ind som <b></b>.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="knap groen" href="/">Til forsiden</a><button class="knap" type="button">Log ud</button></div>';
    ind.querySelector('b').textContent = mig.navn;
    ind.querySelector('button').addEventListener('click', function () {
      try { localStorage.removeItem('hopdop-login'); } catch (e) {}
      location.reload();
    });
  }
  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    fejl.textContent = '';
    if (input.value.length === 6) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true }));
  });
  var sender = false;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (sender) return;
    var kode = input.value.trim();
    if (!/^\d{6}$/.test(kode)) { fejl.textContent = 'Koden er 6 tal. Skriv /weblogin i Minecraft for at få en.'; return; }
    sender = true;
    fejl.className = 'lg-fejl';
    fejl.textContent = 'Logger ind...';
    H.api('weblogin', { method: 'POST', auth: false, body: { kode: kode } }).then(function (j) {
      try { localStorage.setItem('hopdop-login', JSON.stringify(j)); } catch (er) {}
      fejl.className = 'lg-fejl lg-ok';
      fejl.textContent = 'Velkommen, ' + j.navn + '!';
      setTimeout(function () { location.href = til; }, 600);
    }).catch(function (err) {
      sender = false;
      fejl.className = 'lg-fejl';
      fejl.textContent = err.status === 404 ? 'Login virker kun, når siden kører på Cloudflare.' : err.message;
      input.select();
    });
  });
})();
</script>
<script src="top.js"></script>
</body>
</html>
